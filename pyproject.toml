[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mvibe-auth"
version = "1.1.0"
description = "Shared Vibe OIDC authentication helpers"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
dependencies = [
  "authlib==1.9.1",
  "joserfc==1.7.7",
  "pydantic==2.13.4",
  "keyring==25.7.0",
  "cryptography==50.0.2",
  "httpx2==2.16.0",
  "httpx",
  "certifi",
  "truststore",
  "anyio",
  "filelock",
  "pydantic-settings",
  "python-dotenv",
]

[project.optional-dependencies]
proxy = ["fastapi", "uvicorn", "structlog==25.5.0"]
# Container-only: keyring core has no file backend, so the Docker image reads
# the mounted credential keyring file through keyrings.alt (PYTHON_KEYRING_BACKEND).
docker = ["keyrings.alt>=5.0"]
# Optional observability export (proxy-observability spec): OTLP/HTTP spans and
# metrics, e.g. to OpenObserve via OTEL_EXPORTER_OTLP_* env. Inert without it.
otel = ["opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1"]

[dependency-groups]
dev = [
    "pytest",
    "hatchling==1.27.0",
    "fastapi",
    "uvicorn",
    "structlog==25.5.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.14.3",
]

[tool.hatch.build.targets.wheel]
packages = ["mvibe_auth", "mvibe_proxy"]

[tool.hatch.build.targets.sdist]
include = ["mvibe_auth/", "mvibe_proxy/", "proxy.py", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "THIRD_PARTY_NOTICES", "docs/images/", "tests/test_packaging.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -n 2 --dist=loadscope"

[tool.ruff]
target-version = "py312"
extend-exclude = [".tools", ".agents", ".codex", "reports", "dist", "packages", ".venv-packaging"]

[tool.ruff.lint]
# Correctness first; no wholesale style/format migration for the first release.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Imported fixtures and guard modules deliberately run through pytest/import effects.
"tests/**" = ["F401", "F811"]
