[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mvibe-auth"
version = "0.1.0"
description = "Shared Vibe OIDC authentication helpers"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.vibe" }
dependencies = [
  "authlib==1.9.1",
  "joserfc==1.7.7",
  "pydantic==2.13.4",
  "keyring==25.7.0",
  "httpx2==2.16.0",
  "httpx",
  "certifi",
  "truststore",
  "anyio",
  "filelock",
  "pydantic-settings",
  "python-dotenv",
]

[project.optional-dependencies]
proxy = ["fastapi", "uvicorn"]

[dependency-groups]
dev = ["pytest", "hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["mvibe_auth"]

[tool.hatch.build.targets.sdist]
include = ["mvibe_auth/", "proxy.py", "pyproject.toml", "uv.lock", "README.md", "LICENSE.vibe", "tests/test_packaging.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
